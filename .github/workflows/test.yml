name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: git config --global user.email "ci@users.noreply.github.com" && git config --global user.name "ci"
      - run: python -m unittest discover -s tests -v
      - name: Scan this repository with itself
        run: python privacy_scan.py git . --exclude 'tests/*'
